<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2D Shooting Game</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <h1>2D Shooting Game</h1>
      <p class="hint">Move with ←/→ or A/D, shoot with Space.</p>
      <canvas id="game" width="480" height="700" aria-label="2D shooting game canvas"></canvas>
      <p id="status" class="status"></p>
    </main>
    <script src="game.js"></script>
  </body>
</html>
